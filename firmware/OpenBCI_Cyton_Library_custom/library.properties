sentence=The library for using and collecting data from the OpenBCI Cyton (32bit) boards.
paragraph=This library is designed to be used with the PIC32MX250F128B. Use the DefaultBoard.ino for the firmware that ships with the Cyton. See the examples for stripped down versions of the board. See the learning pages at docs.openbci.com for more info! VSC_OpenBCI_Custom-Firmware fork: adds firmware-sequenced fast-cycle impedance, a batched all-at-once lead-off command, and optional DC lead-off status surfacing (see examples/ImpedanceModes and docs/WIRE_FORMAT.md). The stock single-channel 'z' impedance path is unchanged.
